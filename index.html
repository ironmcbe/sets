            from {

                transform: scale(0.95);

            to {
                opacity: 1;
                transform: scale(1);

                transform: scale(1);

            font-family: 'Montserrat Alternates', sans-serif;

            font-size: var(--font-sm);
        }

            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--heading);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 50px;

            transform: translateX(-50%) translateY(0);

            border-radius: var(--radius-xs);

            font-size: var(--font-xs);
            color: var(--heading);

            width: 48px;
            height: 26px;
            flex-shrink: 0;

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

            inset: 0;
            background: #ccc;
            border-radius: 26px;

            transition: all var(--transition);
        }
        .toggle-slider::before {

<body>
    <div class="toast" id="toast"></div>
    <button class="scroll-top" id="scrollTop" aria-label="Наверх"><i class="fas fa-chevron-up"></i></button>
    <div class="container" id="appContainer">
        <header class="header">
            <div class="brand-logo"><i class="fas fa-crown"></i> IronMine</div>
            <div class="header-actions" id="headerActions">
                <button class="btn btn-theme" id="themeToggle"><i class="fas fa-moon"></i> Тема</button>
                <button class="btn btn-admin" id="adminBtn"><i class="fas fa-lock"></i> Админ</button>
            </div>
        </header>
        <div id="dynamicContent"></div>
        <footer class="footer"><span class="footer-brand">IronMine 2020-2027</span></footer>
    </div>

    <script>
        const STORAGE_KEYS = { personnel: 'im_apps_personnel', support: 'im_apps_support', media: 'im_apps_media' };
        const ADMIN_PASS = 'ironminemanager2026custom';
        const ADMIN_STATE_KEY = 'im_admin_state';
        let currentDirection = null;
        let isAdmin = false;
        let adminTab = 'personnel';
        let usedNicknames = { personnel: [], support: [], media: [] };
        const labels = { personnel: 'Персонал', support: 'Поддержка', media: 'Медиа' };
        const icons = { personnel: '🛡️', support: '🎧', media: '🎬' };

        function getToggles() { return RECRUITMENT_SETTINGS; }

        function getApps(dir) { try { return JSON.parse(localStorage.getItem(STORAGE_KEYS[dir]) || '[]'); } catch (e) { return []; } }

        function saveApp(dir, data) { const apps = getApps(dir);
            apps.push(data);
            localStorage.setItem(STORAGE_KEYS[dir], JSON.stringify(apps)); }

        function loadUsedNicknames() { ['personnel', 'support', 'media'].forEach(d => { usedNicknames[d] = getApps(d).map(a =>
                    (a.nickname || '').toLowerCase().trim()).filter(Boolean); }); }

        function countSentences(text) { if (!text || !text.trim()) return 0; const c = text.replace(/\.{2,}/g, '.').replace(
                /[!?]+/g, '.').replace(/\.+/g, '|'); return c.split('|').filter(s => s.trim().length > 0).length; }

        function escapeHtml(t) { const d = document.createElement('div');
            d.textContent = t || ''; return d.innerHTML; }
        let toastTimeout;

        function showToast(msg) { const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 2800); }

        function init() {
            loadUsedNicknames();
            initTheme();
            initScroll();
            initCopyProtection();
            renderHome();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('adminBtn').addEventListener('click', showAdminLogin);
            try { if (sessionStorage.getItem(ADMIN_STATE_KEY) === 'true') { isAdmin = true;
                    adminTab = sessionStorage.getItem('im_admin_tab') || 'personnel';
                    renderAdminPanel(); } } catch (e) {}
        }

        function initTheme() { try { if (localStorage.getItem('im-theme') === 'dark') { document.body.classList.add('dark');
                    document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i> Тема'; } } catch (e) {} }

        function toggleTheme() { const b = document.body.classList.toggle('dark');
            document.getElementById('themeToggle').innerHTML = b ? '<i class="fas fa-sun"></i> Тема' :
                '<i class="fas fa-moon"></i> Тема'; try { localStorage.setItem('im-theme', b ? 'dark' : 'light'); } catch (
                e) {} }

        function initScroll() { let ticking = false;
            window.addEventListener('scroll', () => { if (!ticking) { window.requestAnimationFrame(() => { document
                            .getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
                        ticking = false; });
                    ticking = true; } }, { passive: true });
            document.getElementById('scrollTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' })); }

        function initCopyProtection() {
            document.addEventListener('copy', e => { if (!['input', 'textarea'].includes(document.activeElement?.tagName
                        .toLowerCase())) { e.preventDefault();
                    showToast('🚫 Копирование запрещено'); } });
            document.addEventListener('cut', e => { if (!['input', 'textarea'].includes(document.activeElement?.tagName
                        .toLowerCase())) { e.preventDefault(); } });
            document.addEventListener('contextmenu', e => { if (!['input', 'textarea'].includes(e.target.tagName.toLowerCase()))
                    e.preventDefault(); });
            document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'a', 'u', 'p', 's']
                    .includes(e.key.toLowerCase()) && !['input', 'textarea'].includes(document.activeElement?.tagName
                        .toLowerCase())) { e.preventDefault(); } });
        }

        function renderHome() {
            currentDirection = null;
            isAdmin = false;
            try { sessionStorage.removeItem(ADMIN_STATE_KEY); } catch (e) {}
            const toggles = getToggles();
            const cards = [

                    color: 'media' }

            <button class="btn btn-theme" id="themeToggle"><i class="fas fa-moon"></i> Тема</button>
            <button class="btn btn-admin" id="adminBtn"><i class="fas fa-lock"></i> Админ</button>`;
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

                    q4: document.getElementById('s_q4').value.trim(), q5: document.getElementById('s_q5').value
                        .trim(), q6: document.getElementById('s_q6').value.trim(), q7: document.getElementById(
                            's_q7').value.trim(), q9: document.getElementById('s_q9').value.trim(),
                    q10: document.getElementById('s_q10').value.trim() };
                if (Object.values(d).some(v => !v)) { showToast('❌ Заполните все поля'); return; }
                if (parseInt(d.age) < 14) { showToast('❌ Возраст от 14 лет'); return; }
                if (usedNicknames.support.includes(d.nickname.toLowerCase())) { showToast('❌ Никнейм уже подал заявку'); return; }
                const sq8 = document.querySelector('input[name="sq8"]:checked');
                if (!sq8) { showToast('❌ Ответьте на вопрос 8'); return; }
                const app = { ...d, age: parseInt(d.age), q8: sq8.value === 'other' ? 'Другое: ' + (document.querySelector(
                        '[data-other="sq8"]')?.value || '') : sq8.value, contacts: '', timestamp: new Date()
                        .toISOString(), id: Date.now() };
                saveApp('support', app);
                usedNicknames.support.push(d.nickname.toLowerCase());
                showSuccess('support');
            });
        }

        // --- МЕДИА ---
        function renderMediaForm() {
            currentDirection = 'media';
            document.getElementById('dynamicContent').innerHTML = `
            <button class="btn btn-back" id="btnBack"><i class="fas fa-arrow-left"></i> Назад</button>
            <h1 class="main-title"><span class="gradient-text" style="background:linear-gradient(135deg,var(--accent3),var(--accent3-light),var(--accent3),var(--accent3-light));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientMove 6s ease infinite;">🎬 Медиа</span></h1>
            <div class="sub-header">Связь: <a href="https://t.me/alfdv_bot" target="_blank">@alfdv_bot</a></div>
            <div class="section media-section"><h2 class="section-title"><i class="fas fa-video icon orange"></i> Заявка ютубера</h2>
              <div class="form-group"><label>1. Никнейм <span class="required">*</span></label><input type="text" id="m_nick"></div>
              <div class="form-group"><label>2. Ссылка на канал <span class="required">*</span></label><input type="text" id="m_link"></div>
              <div class="form-group"><label>3. Обороты (просмотры, лайки) <span class="required">*</span></label><input type="text" id="m_stats"></div>
              <div class="form-group"><label>4. Время на контент? <span class="required">*</span></label><input type="text" id="m_time"></div>
              <div class="form-group"><label>5. Готовы делать 2-3 видео в неделю? <span class="required">*</span></label>
                <div class="radio-group" data-g="mq5">
                  <label class="radio-option"><input type="radio" name="mq5" value="Да"><span>Да, готов(а)</span></label>
                  <label class="radio-option"><input type="radio" name="mq5" value="Нет"><span>Нет, меньше</span></label>
                  <label class="radio-option"><input type="radio" name="mq5" value="Другое"><span>Другое:</span></label>
                  <input type="text" class="other-input" style="display:none;" data-other="mq5"></div></div>
            </div>
            <button class="submit-btn media-btn" id="submitMedia"><i class="fas fa-paper-plane"></i> Отправить</button>`;
            document.getElementById('btnBack').addEventListener('click', renderHome);
            setupRadios();
            document.getElementById('submitMedia').addEventListener('click', () => {
                const nickname = document.getElementById('m_nick').value.trim();
                const link = document.getElementById('m_link').value.trim();
                const stats = document.getElementById('m_stats').value.trim();
                const time = document.getElementById('m_time').value.trim();
                const mq5 = document.querySelector('input[name="mq5"]:checked');
                if (!nickname || !link || !stats || !time || !mq5) { showToast('❌ Заполните все поля'); return; }
                const app = { nickname, link, stats, time, q5: mq5.value === 'Другое' ? 'Другое: ' + (document.querySelector(
                        '[data-other="mq5"]')?.value || '') : mq5.value, contacts: '', timestamp: new Date()
                        .toISOString(), id: Date.now() };
                saveApp('media', app);
                showSuccess('media');
            });
        }

        function setupRadios() {
            document.querySelectorAll('.radio-option').forEach(o => o.addEventListener('click', function() {
                const r = this.querySelector('input');
                if (r) r.checked = true;
                const g = this.closest('.radio-group');
                g.querySelectorAll('.radio-option').forEach(x => x.classList.remove('selected'));
                this.classList.add('selected');
                const oi = g.querySelector('.other-input');
                if (oi) oi.style.display = r && (r.value === 'other' || r.value === 'Другое') ? 'block' :
                    'none';
            }));
        }

        function showSuccess(dir) {
            document.getElementById('dynamicContent').innerHTML = `
            <div class="success-block show">
              <div class="success-icon">${icons[dir]}</div>
              <h2 class="success-title">Заявка принята!</h2>
              <div class="success-text">Вы подали заявку в <strong>${labels[dir]}</strong>. Ожидайте итогов.</div>
              <div class="form-group"><label>Контакты (Telegram / VK)</label><input type="text" id="contacts"></div>
              <button class="submit-btn" id="saveContactsBtn"><i class="fas fa-save"></i> Сохранить</button>
              <button class="btn btn-back" id="successBack" style="margin-top:10px;color:var(--text)!important;"><i class="fas fa-home"></i> На главную</button>
            </div>`;
            document.getElementById('saveContactsBtn').addEventListener('click', () => {
                const c = document.getElementById('contacts').value.trim();
                if (!c) { showToast('❌ Введите контакты'); return; }
                const apps = getApps(dir);
                if (apps.length > 0) { apps[apps.length - 1].contacts = c;
                    localStorage.setItem(STORAGE_KEYS[dir], JSON.stringify(apps)); }
                showToast('✅ Сохранено!');
                document.getElementById('saveContactsBtn').style.display = 'none';
                document.getElementById('contacts').disabled = true;
            });
            document.getElementById('successBack').addEventListener('click', renderHome);
        }

        // --- АДМИН ---
        function showAdminLogin() {
            document.getElementById('dynamicContent').innerHTML = `
            <div style="max-width:400px;margin:40px auto;text-align:center;">
              <h2 class="section-title" style="justify-content:center;"><i class="fas fa-lock icon green"></i> Вход</h2>
              <div class="form-group"><input type="password" id="adminPass" placeholder="Пароль"></div>
              <button class="submit-btn" id="loginBtn">Войти</button>
              <button class="logout-btn" id="cancelBtn" style="margin-top:10px;">Отмена</button>
            </div>`;
            document.getElementById('loginBtn').addEventListener('click', () => {
                if (document.getElementById('adminPass').value !== ADMIN_PASS) { showToast('❌ Неверный пароль'); return; }
                isAdmin = true;
                adminTab = 'personnel';
                try { sessionStorage.setItem(ADMIN_STATE_KEY, 'true'); } catch (e) {}
                renderAdminPanel();
            });
            document.getElementById('cancelBtn').addEventListener('click', renderHome);
        }

        function renderAdminPanel() {
            const toggles = getToggles();
            const tabs = ['personnel', 'support', 'media'];
            const tabLabels = { personnel: '🛡️ Персонал', support: '🎧 Поддержка', media: '🎬 Медиа' };
            document.getElementById('headerActions').innerHTML =
                `<button class="btn btn-back" id="adminExit"><i class="fas fa-sign-out-alt"></i> Выйти</button>`;
            document.getElementById('adminExit').addEventListener('click', () => { isAdmin = false; try { sessionStorage.removeItem(ADMIN_STATE_KEY); } catch (e) {}
                renderHome(); });
            document.getElementById('appContainer').classList.add('wide');
            document.getElementById('dynamicContent').innerHTML = `
            <h1 class="main-title"><span class="gradient-text">🔐 Админ-панель</span></h1>
            <div class="admin-tabs">${tabs.map(t=>`<button class="admin-tab${adminTab===t?' active':''}" data-tab="${t}">${tabLabels[t]}</button>`).join('')}</div>
            ${tabs.map(t=>`
            <div class="toggle-row">
              <span class="toggle-label">${tabLabels[t]}:</span>
              <label class="toggle-switch"><input type="checkbox" id="tgl_${t}" ${toggles[t]?'checked':''} disabled><span class="toggle-slider"></span></label>
              <span style="font-size:12px;color:var(--text-secondary);">${toggles[t]?'Открыт':'Закрыт'} <span class="toggle-hint">(меняется в коде)</span></span>
            </div>`).join('')}
            <div id="adminTableArea"></div>`;
            document.querySelectorAll('.admin-tab').forEach(b => b.addEventListener('click', function() { adminTab = this.dataset
                    .tab;
                try { sessionStorage.setItem('im_admin_tab', adminTab); } catch (e) {}
                renderAdminPanel(); }));
            renderAdminTable();
        }

        function renderAdminTable() {
            const apps = getApps(adminTab);
            const area = document.getElementById('adminTableArea');
            let html =
                `<div class="stats-bar"><div class="stat-card"><div class="stat-num">${apps.length}</div><div class="stat-label">Всего</div></div></div>`;
            html +=
                `<div class="table-wrapper"><table class="admin-table"><thead><tr><th>Дата</th><th>Ник</th><th>Имя</th><th>Контакты</th><th>Действ.</th></tr></thead><tbody>`;
            if (!apps.length) html += '<tr><td colspan="5" style="text-align:center;padding:30px;">Нет заявок</td></tr>';
            else apps.forEach(a => {
                html +=
                    `<tr id="r${a.id}"><td>${new Date(a.timestamp).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td><strong>${escapeHtml(a.nickname||'')}</strong></td><td>${escapeHtml(a.name||'')}</td><td>${escapeHtml(a.contacts||'—')}</td><td><button class="expand-btn" data-id="${a.id}">📋</button> <button class="delete-btn" data-id="${a.id}">🗑</button></td></tr>`;
            });
            html += '</tbody></table></div>';
            area.innerHTML = html;
            area.querySelectorAll('.expand-btn').forEach(b => b.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                const er = document.getElementById('det' + id);
                if (er) { er.remove(); return; }
                const app = apps.find(a => a.id === id);
                if (!app) return;
                const tr = document.createElement('tr');
                tr.id = 'det' + id;
                tr.innerHTML =
                    `<td colspan="5" style="background:var(--glass);padding:16px;line-height:1.8;">${Object.entries(app).filter(([k])=>!['id','timestamp','contacts'].includes(k)).map(([k,v])=>'<strong>'+k+':</strong> '+escapeHtml(typeof v==='object'?JSON.stringify(v):v)).join('<br><br>')}</td>`;
                this.closest('tr').after(tr);
            }));
            area.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (!confirm('Удалить заявку #' + id + '?')) return;
                const apps = getApps(adminTab).filter(a => a.id !== id);
                localStorage.setItem(STORAGE_KEYS[adminTab], JSON.stringify(apps));
                loadUsedNicknames();
                renderAdminTable();
                showToast('🗑 Удалено');
            }));
        }

        init();
    </script>
</body>
</html>

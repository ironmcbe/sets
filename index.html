<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>WMine | Набор в команду</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat+Alternates:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ============================================================
           WMINE — ОРАНЖЕВАЯ ТЕМА (ПОЛНЫЙ СТИЛЬ)
           ============================================================ */
        :root {
            --bg: #f5f0eb;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text: #1a120e;
            --text-secondary: #6b5a4e;
            --border: rgba(255, 106, 0, 0.15);
            
            --orange: #ff6a00;
            --orange-light: #ff8c2e;
            --orange-dark: #cc5500;
            --orange-glow: rgba(255, 106, 0, 0.25);
            --orange-glow-soft: rgba(255, 106, 0, 0.08);
            
            --shadow: 0 8px 32px rgba(0,0,0,0.06);
            --shadow-hover: 0 12px 48px rgba(255, 106, 0, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            --font-base: 16px;
            --font-sm: 14px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-2xl: 26px;
            --font-3xl: 32px;
        }

        /* ===== ТЁМНАЯ ТЕМА ===== */
        body.dark {
            --bg: #0d0a08;
            --bg-card: #1a120e;
            --bg-glass: rgba(26, 18, 14, 0.85);
            --text: #f5ede8;
            --text-secondary: #b8a69a;
            --border: rgba(255, 120, 30, 0.15);
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-hover: 0 12px 48px rgba(255, 106, 0, 0.10);
            --orange-glow-soft: rgba(255, 106, 0, 0.05);
        }

        /* ===== БАЗА ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 106, 0, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 106, 0, 0.03) 0%, transparent 60%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 106, 0, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 106, 0, 0.04) 0%, transparent 60%);
        }

        input, textarea {
            user-select: text;
            -webkit-user-select: text;
            font-family: 'Inter', sans-serif;
        }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            max-width: 960px;
            width: 100%;
            padding: 32px 28px;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .container.wide { max-width: 1280px; }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-icon {
            font-size: 32px;
            color: var(--orange);
            filter: drop-shadow(0 0 20px var(--orange-glow));
        }
        .brand-name {
            font-family: 'Montserrat Alternates', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 900;
            font-size: 28px;
            background: linear-gradient(135deg, var(--orange), var(--orange-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .brand-name span {
            font-weight: 600;
            -webkit-text-fill-color: var(--text-secondary);
            font-size: 14px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== КНОПКИ ===== */
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            color: #fff;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            box-shadow: 0 4px 20px var(--orange-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--orange-glow);
        }
        
        .btn-glass {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text) !important;
            box-shadow: none;
        }
        .btn-glass:hover {
            background: rgba(255, 106, 0, 0.10);
            border-color: var(--orange);
        }
        body.dark .btn-glass {
            background: rgba(255, 255, 255, 0.03);
        }
        body.dark .btn-glass:hover {
            background: rgba(255, 106, 0, 0.10);
        }

        .btn-back {
            background: var(--bg-glass);
            color: var(--text) !important;
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .btn-back:hover {
            background: var(--border);
        }

        /* ===== ЗАГОЛОВКИ ===== */
        .main-title {
            font-family: 'Montserrat Alternates', -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            font-size: var(--font-3xl);
            font-weight: 900;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
            position: relative;
            letter-spacing: -0.5px;
        }
        .main-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--orange), var(--orange-light));
            border-radius: 3px;
        }
        .main-title .highlight {
            background: linear-gradient(135deg, var(--orange), var(--orange-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-header {
            text-align: center;
            font-size: var(--font-sm);
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .sub-header a {
            color: var(--orange);
            font-weight: 700;
            text-decoration: none;
            transition: color var(--transition);
        }
        .sub-header a:hover { color: var(--orange-light); }

        /* ===== КАРТОЧКИ НАПРАВЛЕНИЙ ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }
        .direction-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        body.dark .direction-card {
            background: rgba(255, 255, 255, 0.02);
        }
        .direction-card:hover:not(.disabled) {
            transform: translateY(-6px);
            border-color: var(--orange);
            box-shadow: var(--shadow-hover);
        }
        .direction-card:active:not(.disabled) { transform: scale(0.97); }
        .direction-card .card-icon { font-size: 48px; transition: transform var(--transition); }
        .direction-card:hover:not(.disabled) .card-icon { transform: scale(1.1); }
        .direction-card .card-icon.orange { color: var(--orange); }
        .direction-card .card-icon.gray { color: var(--text-secondary); }
        
        .direction-card .card-title {
            font-family: 'Montserrat Alternates', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 800;
            font-size: var(--font-lg);
            color: var(--text);
        }
        .direction-card .card-desc {
            font-size: var(--font-sm);
            color: var(--text-secondary);
        }
        .direction-card .card-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(255, 106, 0, 0.12);
            color: var(--orange);
            border: 1px solid rgba(255, 106, 0, 0.20);
        }
        body.dark .direction-card .card-badge {
            background: rgba(255, 106, 0, 0.15);
        }
        .direction-card .card-badge.closed {
            background: rgba(255, 0, 0, 0.10);
            color: #ff6b6b;
            border-color: rgba(255, 0, 0, 0.20);
        }
        .direction-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .direction-card.disabled:hover {
            transform: none;
            border-color: var(--border);
            box-shadow: none;
        }
        .direction-card.disabled .card-icon {
            filter: grayscale(0.5);
        }

        .closed-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat Alternates', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* ===== СЕКЦИИ ===== */
        .section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px;
            margin-bottom: 18px;
            border-left: 4px solid var(--orange);
        }
        body.dark .section {
            background: rgba(255, 255, 255, 0.02);
        }
        .section-title {
            font-family: 'Montserrat Alternates', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 800;
            font-size: var(--font-lg);
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--orange); }

        /* ===== ФОРМЫ ===== */
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-weight: 600;
            font-size: var(--font-sm);
            margin-bottom: 6px;
            color: var(--text);
        }
        label .required { color: #ff6b6b; font-weight: 700; }
        label .hint {
            display: block;
            font-weight: 400;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 3px;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            outline: none;
            resize: vertical;
            -webkit-appearance: none;
            transition: all var(--transition);
        }
        body.dark input,
        body.dark textarea {
            background: rgba(255, 255, 255, 0.03);
        }
        input:focus, textarea:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px var(--orange-glow-soft);
        }
        textarea { min-height: 100px; line-height: 1.7; }

        /* ===== РАДИО ===== */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--font-sm);
            transition: all var(--transition);
        }
        body.dark .radio-option {
            background: rgba(255, 255, 255, 0.02);
        }
        .radio-option:hover {
            border-color: var(--orange-light);
            background: rgba(255, 106, 0, 0.05);
        }
        .radio-option.selected {
            border-color: var(--orange);
            background: rgba(255, 106, 0, 0.08);
        }
        .radio-option input[type="radio"] {
            accent-color: var(--orange);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .other-input { margin-top: 8px; }

        /* ===== КНОПКА ОТПРАВКИ ===== */
        .submit-btn {
            width: 100%;
            padding: 16px 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-base);
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            box-shadow: 0 6px 24px var(--orange-glow);
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 36px var(--orange-glow);
        }
        .submit-btn:active { transform: scale(0.97); }

        /* ===== ФОРМА (IFRAME) ===== */
        .form-container {
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            min-height: 500px;
        }
        .form-container iframe {
            width: 100%;
            height: 700px;
            border: none;
            background: transparent;
        }

        /* ===== АНИМАЦИИ ===== */
        .fly-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .fly-overlay.active { opacity: 1; }
        .fly-envelope { font-size: 90px; animation: flyAway 1.2s ease-in forwards; }
        .fly-envelope.orange { color: var(--orange); }
        
        @keyframes flyAway {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            30% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            60% { transform: scale(1) translateY(-20px); opacity: 1; }
            100% { transform: scale(0.3) translateY(-300px) translateX(100px) rotate(20deg); opacity: 0; }
        }

        .success-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .success-overlay.active { opacity: 1; pointer-events: all; }
        .success-content {
            text-align: center;
            padding: 40px;
            animation: popIn 0.6s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-icon { font-size: 72px; margin-bottom: 16px; }
        .success-title {
            font-family: 'Montserrat Alternates', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 12px;
        }
        .success-text {
            font-size: var(--font-base);
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.7;
        }
        .success-text a { color: var(--orange); font-weight: 700; text-decoration: none; }
        .success-btn {
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            font-size: var(--font-sm);
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            box-shadow: 0 4px 20px var(--orange-glow);
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .success-btn:hover { transform: translateY(-2px); }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text);
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: var(--font-sm);
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            font-family: 'Inter', sans-serif;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

        /* ===== ФУТЕР ===== */
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
            text-align: center;
        }
        .footer-brand {
            font-family: 'Montserrat Alternates', sans-serif;
            font-weight: 900;
            font-size: 18px;
            background: linear-gradient(135deg, var(--orange), var(--orange-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .footer-links {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--font-sm);
            transition: color var(--transition);
        }
        .footer-links a:hover {
            color: var(--orange);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 16px 14px; border-radius: 16px; }
            .main-title { font-size: var(--font-2xl); }
            .brand-name { font-size: 22px; }
            .cards-grid { grid-template-columns: 1fr; }
            .section { padding: 18px 14px; }
            .section-title { font-size: var(--font-base); }
            .btn { font-size: 12px; padding: 8px 16px; }
            .form-container iframe { height: 600px; }
        }

        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; }
            .main-title { font-size: 22px; }
            .brand-name { font-size: 20px; }
            .form-container iframe { height: 550px; }
        }
    </style>
</head>
<body>

    <!-- ===== ОВЕРЛЕИ ===== -->
    <div class="fly-overlay" id="flyOverlay">
        <div class="fly-envelope orange" id="flyEnvelope">📨</div>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon">✅</div>
            <div class="success-title">Заявка отправлена!</div>
            <div class="success-text">
                Ожидайте итогов в Telegram:<br>
                <a href="https://t.me/wminepe" target="_blank">@wminepe</a>
            </div>
            <button class="success-btn" id="closeSuccessBtn">Понятно</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ===== ОСНОВНОЙ КОНТЕЙНЕР ===== -->
    <div class="container" id="appContainer">
        <header class="header">
            <div class="brand">
                <span class="brand-icon"><i class="fas fa-fire"></i></span>
                <span class="brand-name">WMine</span>
            </div>
            <div class="header-actions" id="headerActions"></div>
        </header>

        <div id="dynamicContent"></div>

        <footer class="footer">
            <span class="footer-brand">WMine 2026</span>
            <div class="footer-links">
                <a href="https://t.me/wminepe" target="_blank"><i class="fas fa-telegram"></i> @wminepe</a>
                <a href="#" onclick="showToast('📧 По всем вопросам: @wminepe')"><i class="fas fa-envelope"></i> Контакты</a>
            </div>
        </footer>
    </div>

    <script>
        // ============================================================
        //  WMINE — ПОЛНЫЙ СКРИПТ
        // ============================================================

        // ===== НАСТРОЙКИ =====
        const FORMS = {
            personnel: 'https://docs.google.com/forms/d/e/1FAIpQLSd8E94uFa_DzERmWd68Ap1HN_YIo2pRqihxNQC-Tw-uaGqDqA/viewform?usp=dialog',
            support: null, // пока закрыт
            media: 'https://docs.google.com/forms/d/e/1FAIpQLScCelD2EEQJiAdxU1hNrhiCmKn95bgSa5GJuJcniL6uHWPE2Q/viewform?usp=dialog'
        };

        const RECRUITMENT_SETTINGS = {
            personnel: true,
            support: false,
            media: true
        };

        let isAdmin = false;
        let currentDirection = null;
        let toastTimeout;

        const labels = {
            personnel: '🛡️ Модерация',
            support: '🎧 Поддержка',
            media: '🎬 Медиа'
        };

        // ============================================================
        //  ТЕМА
        // ============================================================
        function toggleTheme() {
            const b = document.body.classList.toggle('dark');
            try {
                localStorage.setItem('wmine-theme', b ? 'dark' : 'light');
            } catch(e) {}
            // Перерисовываем текущую страницу
            const html = document.getElementById('dynamicContent').innerHTML;
            if (html.includes('Админ-панель')) {
                renderAdminPanel();
            } else if (html.includes('Модерация')) {
                renderPersonnelForm();
            } else if (html.includes('Поддержка')) {
                renderSupportForm();
            } else if (html.includes('Медиа')) {
                renderMediaForm();
            } else {
                renderHome();
            }
            updateHeaderButtons();
        }

        function updateHeaderButtons() {
            const actions = document.getElementById('headerActions');
            if (!isAdmin) {
                actions.innerHTML = `
                    <button class="btn btn-glass" onclick="toggleTheme()">
                        <i class="fas ${document.body.classList.contains('dark') ? 'fa-sun' : 'fa-moon'}"></i> Тема
                    </button>
                    <button class="btn btn-primary" onclick="showAdminLogin()">
                        <i class="fas fa-lock"></i> Админ
                    </button>
                `;
            }
        }

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function playSuccessAnimation() {
            const flyOverlay = document.getElementById('flyOverlay');
            const flyEnvelope = document.getElementById('flyEnvelope');
            const successOverlay = document.getElementById('successOverlay');
            flyEnvelope.className = 'fly-envelope orange';
            flyOverlay.classList.add('active');
            setTimeout(() => {
                flyOverlay.classList.remove('active');
                successOverlay.classList.add('active');
            }, 1200);
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        async function init() {
            try {
                if (localStorage.getItem('wmine-theme') === 'dark') {
                    document.body.classList.add('dark');
                }
                renderHome();
                document.getElementById('closeSuccessBtn').addEventListener('click', () => {
                    document.getElementById('successOverlay').classList.remove('active');
                    renderHome();
                });
            } catch(e) {
                console.error('Init error:', e);
                document.getElementById('dynamicContent').innerHTML = `
                    <div style="padding:40px;text-align:center;color:var(--text-secondary);">
                        ⚠️ Ошибка загрузки. Пожалуйста, обновите страницу.
                    </div>
                `;
            }
        }

        // ============================================================
        //  ГЛАВНАЯ СТРАНИЦА
        // ============================================================
        function renderHome() {
            isAdmin = false;
            currentDirection = null;
            
            const cards = [
                { id: 'personnel', icon: '🛡️', title: 'Модерация', desc: 'Станьте хелпером, модератором или администратором сервера.', open: RECRUITMENT_SETTINGS.personnel },
                { id: 'support', icon: '🎧', title: 'Поддержка', desc: 'Техническая поддержка игроков.', open: RECRUITMENT_SETTINGS.support },
                { id: 'media', icon: '🎬', title: 'Медиа', desc: 'Создавайте контент на YouTube, VK Видео, TikTok.', open: RECRUITMENT_SETTINGS.media }
            ];

            let html = `
                <h1 class="main-title">
                    <span class="highlight">🔥 Набор в команду WMine</span>
                </h1>
                <div class="sub-header">
                    Выберите направление для подачи заявки
                </div>
                <div class="cards-grid">
            `;

            cards.forEach(c => {
                const isOpen = c.open && FORMS[c.id] !== null;
                const disabled = !isOpen;
                html += `
                    <div class="direction-card ${disabled ? 'disabled' : ''}" data-dir="${c.id}" ${!disabled ? `onclick="openForm('${c.id}')"` : ''}>
                        ${!isOpen && FORMS[c.id] === null ? '<div class="closed-overlay">🔒 Набор закрыт</div>' : ''}
                        <span class="card-icon ${isOpen ? 'orange' : 'gray'}">${c.icon}</span>
                        <div class="card-title">${c.title}</div>
                        <div class="card-desc">${c.desc}</div>
                        <span class="card-badge ${!isOpen ? 'closed' : ''}">${isOpen ? '✅ Открыт' : '🔒 Закрыт'}</span>
                    </div>
                `;
            });

            html += `</div>`;

            document.getElementById('dynamicContent').innerHTML = html;
            document.getElementById('appContainer').classList.remove('wide');
            updateHeaderButtons();
        }

        // ============================================================
        //  ОТКРЫТЬ ФОРМУ
        // ============================================================
        function openForm(direction) {
            const url = FORMS[direction];
            if (!url) {
                showToast('🔒 Набор закрыт');
                return;
            }

            currentDirection = direction;
            
            let html = `
                <button class="btn btn-back" onclick="renderHome()" style="margin-bottom:16px;">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>
                <h1 class="main-title"><span class="highlight">${labels[direction]}</span></h1>
                <div class="sub-header">
                    Заполните анкету<br>
                    <a href="https://t.me/wminepe" target="_blank"><i class="fas fa-telegram"></i> @wminepe</a>
                </div>
                <div class="form-container">
                    <iframe src="${url}" allow="geolocation; microphone; camera; midi; encrypted-media" loading="lazy"></iframe>
                </div>
                <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary);">
                    <i class="fas fa-shield-alt"></i> Ваши данные защищены
                </div>
            `;

            document.getElementById('dynamicContent').innerHTML = html;
            document.getElementById('appContainer').classList.remove('wide');
            
            // Обновляем кнопки хедера
            document.getElementById('headerActions').innerHTML = `
                <button class="btn btn-glass" onclick="toggleTheme()">
                    <i class="fas ${document.body.classList.contains('dark') ? 'fa-sun' : 'fa-moon'}"></i> Тема
                </button>
            `;
            
            showToast('📋 Заполните анкету');

            // Скролл к форме
            setTimeout(() => {
                document.querySelector('.form-container')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        // ============================================================
        //  АДМИН-ПАНЕЛЬ (ДЕМО, ТОЛЬКО ДЛЯ КРАСОТЫ)
        // ============================================================
        function showAdminLogin() {
            document.getElementById('dynamicContent').innerHTML = `
                <div style="max-width:400px;margin:40px auto;text-align:center;">
                    <div style="font-size:48px;color:var(--orange);margin-bottom:12px;">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <h2 style="font-family:'Montserrat Alternates',sans-serif;font-size:24px;font-weight:800;color:var(--text);margin-bottom:8px;">
                        Доступ к админ-панели
                    </h2>
                    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:20px;">
                        Введите пароль для продолжения
                    </p>
                    <div class="form-group">
                        <input type="password" id="adminPass" placeholder="Пароль" style="text-align:center;font-size:16px;">
                    </div>
                    <button class="submit-btn" id="loginBtn" style="margin-bottom:10px;">
                        <i class="fas fa-sign-in-alt"></i> Войти
                    </button>
                    <button class="btn btn-glass" onclick="renderHome()" style="width:100%;justify-content:center;">
                        Отмена
                    </button>
                </div>
            `;

            document.getElementById('loginBtn').addEventListener('click', () => {
                if (document.getElementById('adminPass').value !== 'wmineadmin2026') {
                    showToast('❌ Неверный пароль');
                    return;
                }
                isAdmin = true;
                renderAdminPanel();
            });

            document.getElementById('headerActions').innerHTML = '';
        }

        function renderAdminPanel() {
            document.getElementById('headerActions').innerHTML = `
                <button class="btn btn-glass" onclick="adminExit()">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
                <button class="btn btn-glass" onclick="toggleTheme()">
                    <i class="fas ${document.body.classList.contains('dark') ? 'fa-sun' : 'fa-moon'}"></i> Тема
                </button>
            `;
            document.getElementById('appContainer').classList.add('wide');

            // Собираем статистику по открытым/закрытым наборам
            const total = Object.keys(RECRUITMENT_SETTINGS).length;
            const openCount = Object.values(RECRUITMENT_SETTINGS).filter(v => v === true).length;

            document.getElementById('dynamicContent').innerHTML = `
                <h1 class="main-title"><span class="highlight">🔐 Админ-панель</span></h1>
                <div class="admin-card" style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:18px;">
                    <div class="admin-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px;">
                        <div class="admin-stat" style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;">
                            <div class="stat-value" style="font-family:'Montserrat Alternates',sans-serif;font-size:32px;font-weight:900;color:var(--orange);line-height:1;">${total}</div>
                            <div class="stat-label" style="font-size:12px;color:var(--text-secondary);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;">Всего наборов</div>
                        </div>
                        <div class="admin-stat" style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;">
                            <div class="stat-value" style="font-family:'Montserrat Alternates',sans-serif;font-size:32px;font-weight:900;color:#00b894;line-height:1;">${openCount}</div>
                            <div class="stat-label" style="font-size:12px;color:var(--text-secondary);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;">Открыто</div>
                        </div>
                        <div class="admin-stat" style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;">
                            <div class="stat-value" style="font-family:'Montserrat Alternates',sans-serif;font-size:32px;font-weight:900;color:#ff6b6b;line-height:1;">${total - openCount}</div>
                            <div class="stat-label" style="font-size:12px;color:var(--text-secondary);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;">Закрыто</div>
                        </div>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:8px;">
                        ${Object.keys(RECRUITMENT_SETTINGS).map(key => `
                            <div class="toggle-row" style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);border:1px solid var(--border);">
                                <span class="toggle-label" style="font-weight:700;font-size:13px;color:var(--text);min-width:120px;font-family:'Inter',sans-serif;">${labels[key]}</span>
                                <label class="toggle-switch" style="position:relative;width:48px;height:26px;flex-shrink:0;">
                                    <input type="checkbox" disabled ${RECRUITMENT_SETTINGS[key] ? 'checked' : ''}>
                                    <span class="toggle-slider" style="position:absolute;inset:0;background:#444;border-radius:26px;cursor:pointer;transition:0.3s;"></span>
                                </label>
                                <span style="font-size:12px;color:var(--text-secondary);">${RECRUITMENT_SETTINGS[key] ? '✅ Открыт' : '🔒 Закрыт'}</span>
                                <span style="font-size:11px;color:var(--text-secondary);margin-left:auto;opacity:0.5;">${FORMS[key] ? 'форма есть' : 'нет формы'}</span>
                            </div>
                        `).join('')}
                    </div>

                    <p style="font-size:12px;color:var(--text-secondary);margin-top:16px;padding:12px;background:rgba(255,106,0,0.06);border-radius:var(--radius-sm);border-left:3px solid var(--orange);">
                        ⚙️ Управление наборами: редактируйте <code style="background:rgba(0,0,0,0.1);padding:2px 8px;border-radius:4px;font-family:monospace;">RECRUITMENT_SETTINGS</code> и <code style="background:rgba(0,0,0,0.1);padding:2px 8px;border-radius:4px;font-family:monospace;">FORMS</code> в коде
                    </p>
                </div>
            `;

            // Добавляем стили для переключателей (встроенные)
            const styleToggle = document.createElement('style');
            styleToggle.textContent = `
                .toggle-slider::before {
                    content: '';
                    position: absolute;
                    height: 20px;
                    width: 20px;
                    left: 3px;
                    bottom: 3px;
                    background: #fff;
                    border-radius: 50%;
                    transition: 0.3s;
                }
                input:checked + .toggle-slider { background: var(--orange); }
                input:checked + .toggle-slider::before { transform: translateX(22px); }
                body.dark .toggle-slider { background: #555; }
            `;
            document.head.appendChild(styleToggle);
        }

        function adminExit() {
            isAdmin = false;
            renderHome();
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(init, 150);
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(init, 150);
        }
    </script>
</body>
</html>

<body>
    <div class="toast" id="toast"></div>
    <button class="scroll-top" id="scrollTop" aria-label="Наверх"><i class="fas fa-chevron-up"></i></button>
    <div class="container" id="appContainer">
        <header class="header">
            <div class="brand-logo"><i class="fas fa-crown"></i> IronMine</div>
            <div class="header-actions" id="headerActions">
                <button class="btn btn-theme" id="themeToggle"><i class="fas fa-moon"></i> Тема</button>
                <button class="btn btn-admin" id="adminBtn"><i class="fas fa-lock"></i> Админ</button>
            </div>
        </header>
        <div id="dynamicContent"></div>
        <footer class="footer"><span class="footer-brand">IronMine 2020-2027</span></footer>
    </div>

    <script>
        const STORAGE_KEYS = {
            personnel: 'im_apps_personnel',
            support: 'im_apps_support',
            media: 'im_apps_media'
        };
        const ADMIN_PASS = 'ironminemanager2026custom';
        const TOGGLE_CACHE_KEY = 'im_toggles_cache';
        let recruitmentToggles = RECRUITMENT_SETTINGS;
        let usedNicknames = {
            personnel: [],
            support: [],
            media: []
        };
        let currentDirection = null;
        let isAdmin = false;
        let adminTab = 'personnel';
        let currentSearchFilter = '';
        const labels = {
            personnel: 'Персонал',
            support: 'Поддержка',
            media: 'Медиа'
        };
        const icons = {
            personnel: '🛡️',
            support: '🎧',
            media: '🎬'
        };

        function getToggles() {
            return recruitmentToggles;
        }

        function getApps(dir) {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEYS[dir]) || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveApp(dir, data) {
            const apps = getApps(dir);
            apps.push(data);
            localStorage.setItem(STORAGE_KEYS[dir], JSON.stringify(apps));
        }

        function clearAllApps(dir) {
            localStorage.setItem(STORAGE_KEYS[dir], '[]');
            loadUsedNicknames();
        }

        function loadUsedNicknames() {
            ['personnel', 'support', 'media'].forEach(d => {
                usedNicknames[d] = getApps(d).map(a => (a.nickname || '').toLowerCase().trim()).filter(
                Boolean);
            });
        }

        function countSentences(text) {
            if (!text || !text.trim()) return 0;
            const c = text.replace(/\.{2,}/g, '.').replace(/[!?]+/g, '.').replace(/\.+/g, '|');
            return c.split('|').filter(s => s.trim().length > 0).length;
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t || '';
            return d.innerHTML;
        }

        let toastTimeout;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 2800);
        }

        function init() {
            recruitmentToggles = RECRUITMENT_SETTINGS;
            loadUsedNicknames();
            initTheme();
            initScroll();
            initCopyProtection();
            renderHome();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('adminBtn').addEventListener('click', showAdminLogin);
        }

        function initTheme() {
            try {
                if (localStorage.getItem('im-theme') === 'dark') {
                    document.body.classList.add('dark');
                    document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i> Тема';
                }
            } catch (e) {}
        }

        function toggleTheme() {
            const b = document.body.classList.toggle('dark');
            document.getElementById('themeToggle').innerHTML = b ? '<i class="fas fa-sun"></i> Тема' :
                '<i class="fas fa-moon"></i> Тема';
            try {
                localStorage.setItem('im-theme', b ? 'dark' : 'light');
            } catch (e) {}
        }

        function initScroll() {
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        document.getElementById('scrollTop').classList.toggle('visible', window.scrollY >
                            400);
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
            document.getElementById('scrollTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        function initCopyProtection() {
            document.addEventListener('copy', e => {
                if (!['input', 'textarea'].includes(document.activeElement?.tagName.toLowerCase())) {
                    e.preventDefault();
                    showToast('🚫 Копирование запрещено');
                }
            });
            document.addEventListener('cut', e => {
                if (!['input', 'textarea'].includes(document.activeElement?.tagName.toLowerCase())) {
                    e.preventDefault();
                }
            });
            document.addEventListener('contextmenu', e => {
                if (!['input', 'textarea'].includes(e.target.tagName.toLowerCase())) e.preventDefault();
            });
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'a', 'u', 'p', 's'].includes(e.key.toLowerCase()) &&
                    !['input', 'textarea'].includes(document.activeElement?.tagName.toLowerCase())) {
                    e.preventDefault();
                }
            });
        }

        function renderHome() {
            currentDirection = null;
            isAdmin = false;
            const toggles = getToggles();
            const cards = [
                { id: 'personnel', icon: '🛡️', title: 'Персонал',
                    desc: 'Станьте хелпером, модератором или администратором сервера.', color: 'personnel' },
                { id: 'support', icon: '🎧', title: 'Поддержка',

                { id: 'media', icon: '🎬', title: 'Медиа',
                    desc: 'Создавайте контент на YouTube, VK Видео, TikTok.', color: 'media' }

            <div class="sub-header">Выберите направление для подачи заявки</div>

              </div>`).join('')}</div>`;
            document.querySelectorAll('.direction-card').forEach(card => card.addEventListener('click', function() {
                const dir = this.dataset.dir;
                if (!getToggles()[dir]) {
                    showToast('🔒 Набор в этом направлении временно закрыт');
                    return;

                if (dir === 'personnel') renderPersonnelForm();
                if (dir === 'support') renderSupportForm();
                if (dir === 'media') renderMediaForm();
            }));
            document.getElementById('headerActions').innerHTML = `
            <button class="btn btn-theme" id="themeToggle"><i class="fas fa-moon"></i> Тема</button>
            <button class="btn btn-admin" id="adminBtn"><i class="fas fa-lock"></i> Админ</button>`;
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('adminBtn').addEventListener('click', showAdminLogin);
            document.getElementById('appContainer').classList.remove('wide');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        //  АНКЕТА ПЕРСОНАЛА

                tr.className = 'detail-row';
                tr.innerHTML =
                    `<td colspan="5">${Object.entries(app).filter(([k])=>!['id','timestamp','contacts'].includes(k)).map(([k,v])=>'<strong>'+k+':</strong> '+escapeHtml(typeof v==='object'?JSON.stringify(v):v)).join('<br><br>')}</td>`;
                this.closest('tr').after(tr);
            }));

            area.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (!confirm('🗑 Удалить заявку #' + id + ' навсегда?')) return;
                const apps = getApps(adminTab).filter(a => a.id !== id);
                localStorage.setItem(STORAGE_KEYS[adminTab], JSON.stringify(apps));
                loadUsedNicknames();
                renderAdminTable();
                showToast('🗑 Заявка удалена');
            }));
        }

        init();
    </script>
</body>
</html>

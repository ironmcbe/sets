<body>
    <div class="toast" id="toast"></div>
    <div class="container" id="appContainer">
        <header class="header">
            <div class="brand-logo"><i class="fas fa-crown"></i> IronMine</div>
            <div class="header-actions" id="headerActions">
                <button class="btn btn-theme" id="themeToggle"><i class="fas fa-moon"></i> Тема</button>
                <button class="btn btn-admin" id="adminBtn"><i class="fas fa-lock"></i> Админ</button>
            </div>
        </header>
        <div id="dynamicContent"></div>
        <footer class="footer"><span class="footer-brand">IronMine 2020-2027</span></footer>
    </div>

    <script>
        const STORAGE_KEYS = { personnel: 'im_apps_personnel', support: 'im_apps_support', media: 'im_apps_media' };
        const ADMIN_PASS = 'ironminemanager2026custom';
        const TOGGLE_CACHE_KEY = 'im_toggles_cache';
        let recruitmentToggles = { personnel: true, support: true, media: true };
        let usedNicknames = { personnel: [], support: [], media: [] };
        let currentDirection = null;
        let isAdmin = false;
        let adminTab = 'personnel';
        const labels = { personnel: 'Персонал', support: 'Поддержка', media: 'Медиа' };
        const icons = { personnel: '🛡️', support: '🎧', media: '🎬' };

        // ===== ЗАГРУЗКА ИЗ GOOGLE SHEETS =====
        async function fetchToggles() {
            try {
                const resp = await fetch(SHEET_CSV_URL + '&_=' + Date.now());
                const text = await resp.text();
                const lines = text.trim().split('\n');
                const result = { personnel: true, support: true, media: true };
                lines.forEach(line => {
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const key = parts[0].trim();
                        const val = parts[1].trim().toUpperCase();
                        if (result.hasOwnProperty(key)) {
                            result[key] = val === 'TRUE';
                        }
                    }
                });
                recruitmentToggles = result;
                localStorage.setItem(TOGGLE_CACHE_KEY, JSON.stringify(result));
                return result;
            } catch (e) {
                const cached = localStorage.getItem(TOGGLE_CACHE_KEY);
                if (cached) {
                    recruitmentToggles = JSON.parse(cached);
                }
                return recruitmentToggles;
            }
        }

        // ===== СОХРАНЕНИЕ В GOOGLE SHEETS =====
        async function saveToggle(direction, value) {
            try {
                const formData = new FormData();
                formData.append('direction', direction);
                formData.append('value', value ? 'TRUE' : 'FALSE');

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                recruitmentToggles[direction] = value;
                localStorage.setItem(TOGGLE_CACHE_KEY, JSON.stringify(recruitmentToggles));
                return true;
            } catch (e) {
                recruitmentToggles[direction] = value;
                localStorage.setItem(TOGGLE_CACHE_KEY, JSON.stringify(recruitmentToggles));
                return false;
            }
        }

        function getToggles() { return recruitmentToggles; }

        // ===== LOCAL STORAGE ДЛЯ ЗАЯВОК =====
        function getApps(dir) { try { return JSON.parse(localStorage.getItem(STORAGE_KEYS[dir]) || '[]'); } catch (e) { return []; } }

        function saveApp(dir, data) { const apps = getApps(dir);
            apps.push(data);
            localStorage.setItem(STORAGE_KEYS[dir], JSON.stringify(apps)); }

        function loadUsedNicknames() { ['personnel', 'support', 'media'].forEach(d => { usedNicknames[d] = getApps(d).map(a =>
                    (a.nickname || '').toLowerCase().trim()).filter(Boolean); }); }

        function countSentences(text) { if (!text || !text.trim()) return 0; const c = text.replace(/\.{2,}/g, '.').replace(
                /[!?]+/g, '.').replace(/\.+/g, '|'); return c.split('|').filter(s => s.trim().length > 0).length; }

        function escapeHtml(t) { const d = document.createElement('div');
            d.textContent = t || ''; return d.innerHTML; }
        let toastTimeout;

        function showToast(msg) { const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 2800); }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        async function init() {
            await fetchToggles();
            loadUsedNicknames();
            initTheme();
            initCopyProtection();
            renderHome();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('adminBtn').addEventListener('click', showAdminLogin);
        }

        function initTheme() { try { if (localStorage.getItem('im-theme') === 'dark') { document.body.classList.add('dark');
                    document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i> Тема'; } } catch (e) {} }

        function toggleTheme() { const b = document.body.classList.toggle('dark');
            document.getElementById('themeToggle').innerHTML = b ? '<i class="fas fa-sun"></i> Тема' :
                '<i class="fas fa-moon"></i> Тема'; try { localStorage.setItem('im-theme', b ? 'dark' : 'light'); } catch (
                e) {} }

        function initCopyProtection() {
            document.addEventListener('copy', e => { if (!['input', 'textarea'].includes(document.activeElement?.tagName
                        .toLowerCase())) e.preventDefault(); });
            document.addEventListener('cut', e => { if (!['input', 'textarea'].includes(document.activeElement?.tagName
                        .toLowerCase())) e.preventDefault(); });
            document.addEventListener('contextmenu', e => { if (!['input', 'textarea'].includes(e.target.tagName.toLowerCase()))
                    e.preventDefault(); });
        }

        // ===== ГЛАВНЫЙ ЭКРАН =====
        async function renderHome() {
            currentDirection = null;
            isAdmin = false;
            await fetchToggles();
            const toggles = getToggles();
            const cards = [
                { id: 'personnel', icon: '🛡️', title: 'Персонал', desc: 'Хелперы, модераторы, администраторы.',
                    color: 'personnel' },
                { id: 'support', icon: '🎧', title: 'Поддержка', desc: 'Техническая помощь игрокам.', color: 'support' },
                { id: 'media', icon: '🎬', title: 'Медиа', desc: 'Контент на YouTube, VK, TikTok.', color: 'media' }
            ];
            document.getElementById('dynamicContent').innerHTML = `
            <h1 class="main-title"><span class="gradient-text">📝 Набор в команду</span></h1>
            <div class="sub-header">Выберите направление</div>
            <div class="cards-grid">${cards.map(c => `
              <div class="direction-card ${c.color}" data-dir="${c.id}">
                ${!toggles[c.id] ? '<div class="closed-overlay">🔒 Набор закрыт</div>' : ''}
                <span class="card-icon">${c.icon}</span>
                <div class="card-title">${c.title}</div>
                <div class="card-desc">${c.desc}</div>
                <span class="card-badge">${toggles[c.id] ? '✅ Открыт' : '🔒 Закрыт'}</span>
              </div>`).join('')}</div>`;
            document.querySelectorAll('.direction-card').forEach(card => card.addEventListener('click', function() {
                const dir = this.dataset.dir;
                if (!getToggles()[dir]) { showToast('🔒 Набор закрыт'); return; }
                if (dir === 'personnel') renderPersonnelForm();
                if (dir === 'support') renderSupportForm();
                if (dir === 'media') renderMediaForm();
            }));
            document.getElementById('headerActions').innerHTML = `
            <button class="btn btn-theme" id="themeToggle"><i class="fas fa-moon"></i> Тема</button>
            <button class="btn btn-admin" id="adminBtn"><i class="fas fa-lock"></i> Админ</button>`;
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('adminBtn').addEventListener('click', showAdminLogin);
        }

        // ===== ФОРМЫ (сокращённые) =====
        function renderPersonnelForm() {
            currentDirection = 'personnel';
            const v = Math.floor(Math.random() * 3) + 1;
            const vars = {
                1: [{ q: 'Тим с читером?', o: ['2.2', '3.1', '2.1', '1.14'] }, { q: 'Регионы с матом?', o: ['3.1', '3.6',
                        '4.4', '4.13'] }, { q: 'Наказание 2.3?', o: ['Снятие', 'Бан 43800', 'Бан 43800+снятие',
                        'Бан навсегда+снятие'] }, { q: 'Наказание 3.7?', o: ['Бан 4320', 'Пред+бан 4320', 'Бан без разблок.',
                        'Бан 10080'] }, { q: 'Ложный вайп?', o: ['1.12+3.6', '3.5', '1.12+3.4', '1.12'] }],
                2: [{ q: 'Недоработки?', o: ['1.13', '3.3', '4.8', '1.11'] }, { q: 'Префиксы?', o: ['4.7', '4.1', '3.8',
                        '3.6'] }, { q: 'Наказание 1.1?', o: ['Мут 30/60', 'Пред', 'Пред+мут', 'Мут 180'] }, { q: 'Наказание 1.8?',
                        o: ['Мут 60', 'Мут 30/60', 'Бан 4320', 'Мут 180'] }, { q: 'Вышел при проверке?', o: ['2.1:43800',
                            '2.5:43800', '2.2:30240', '2.5:10080']
                    }],
                3: [{ q: 'Обход мута?', o: ['5.2', '1.15', '1.9', '5.1'] }, { q: 'Оффтоп в /report?', o: ['1.7', '2.4',
                        '3.5', '4.1'] }, { q: 'Наказание 1.14?', o: ['Мут 10080', 'Бан+снятие', 'Бан 43800', 'Бан 10080'] },
                    { q: 'Наказание 4.2?', o: ['Бан 20160', 'Пред+бан 10080', 'Пред+бан 1440', 'Бан 10080'] }, { q: 'Данные сервера?',
                        o: ['1.11:10080', '1.12:10080', '1.11:навсегда', '1.13:60'] }
                ]
            };
            const q = vars[v];
            document.getElementById('dynamicContent').innerHTML = `
            <button class="btn btn-back" id="btnBack">← Назад</button>
            <h1 class="main-title"><span class="gradient-text">🛡️ Персонал</span></h1>
            ${['Имя','Возраст (13+)','Никнейм','Наиграно','Город'].map((l,i)=>`<div class="form-group"><label>${l} *</label><input type="${i===1?'number':'text'}" id="p_${['name','age','nick','time','city'][i]}"></div>`).join('')}
            <div class="form-group"><label>6. Хелпер? *</label><textarea id="p_q6"></textarea></div>
            <div class="form-group"><label>7. Опыт *</label><textarea id="p_q7"></textarea></div>
            <div class="form-group"><label>8. Часов в день? *</label><input type="text" id="p_q8"></div>
            <div class="form-group"><label>9. О себе *</label><textarea id="p_q9"></textarea></div>
            ${q.map((item,i)=>{const n='pq'+i;return`<div class="form-group"><label>${i+1}. ${item.q} *</label><div class="radio-group">${[...item.o].sort(()=>Math.random()-0.5).map(o=>`<label class="radio-option"><input type="radio" name="${n}" value="${item.o.indexOf(o)}">${o}</label>`).join('')}<label class="radio-option"><input type="radio" name="${n}" value="other">Другое:</label><input type="text" class="other-input" style="display:none;" data-other="${n}"></div></div>`;}).join('')}
            <button class="submit-btn" id="submitPersonnel">Отправить</button>`;
            document.getElementById('btnBack').addEventListener('click', renderHome);
            setupRadios();
            document.getElementById('submitPersonnel').addEventListener('click', () => {
                const d = ['name', 'age', 'nick', 'time', 'city'].reduce((o, k) => (o[k] = document.getElementById(
                    'p_' + k).value.trim(), o), {});
                d.q6 = document.getElementById('p_q6').value.trim();
                d.q7 = document.getElementById('p_q7').value.trim();
                d.q8 = document.getElementById('p_q8').value.trim();
                d.q9 = document.getElementById('p_q9').value.trim();
                if (Object.values(d).some(v => !v)) { showToast('❌ Заполните все поля'); return; }
                if (parseInt(d.age) < 13) { showToast('❌ Возраст 13+'); return; }
                if (usedNicknames.personnel.includes(d.nickname.toLowerCase())) { showToast('❌ Уже подавал'); return; }
                if (countSentences(d.q6) < 5 || countSentences(d.q9) < 5) { showToast('❌ Нужно 5 предложений'); return; }
                const answ = [];
                for (let i = 0; i < q.length; i++) {
                    const n = 'pq' + i;
                    const c = document.querySelector('input[name="' + n + '"]:checked');
                    if (!c) { showToast('❌ Ответьте на тест'); return; }
                    answ.push(c.value === 'other' ? 'Другое: ' + (document.querySelector('[data-other="' + n +
                        '"]')?.value || '') : q[i].o[parseInt(c.value)]);
                }
                saveApp('personnel', { ...d, variant: v, answers: answ, contacts: '', id: Date.now(), timestamp: new Date()
                        .toISOString() });
                usedNicknames.personnel.push(d.nickname.toLowerCase());
                showSuccess('personnel');
            });
        }

        function renderSupportForm() {
            currentDirection = 'support';
            document.getElementById('dynamicContent').innerHTML = `
            <button class="btn btn-back" id="btnBack">← Назад</button>
            <h1 class="main-title"><span class="gradient-text">🎧 Поддержка</span></h1>
            ${['Имя','Возраст (14+)','Никнейм'].map((l,i)=>`<div class="form-group"><label>${l} *</label><input type="${i===1?'number':'text'}" id="s_${['name','age','nick'][i]}"></div>`).join('')}
            ${[4,5,6,7,9,10].map(i=>`<div class="form-group"><label>${i}. Вопрос *</label><textarea id="s_q${i}"></textarea></div>`).join('')}
            <div class="form-group"><label>8. Ник iwi09876? *</label><div class="radio-group">
              <label class="radio-option"><input type="radio" name="sq8" value="2.5">2.5</label>
              <label class="radio-option"><input type="radio" name="sq8" value="1.13">1.13</label>
              <label class="radio-option"><input type="radio" name="sq8" value="3.4">3.4</label>
              <label class="radio-option"><input type="radio" name="sq8" value="other">Другое:</label>
              <input type="text" class="other-input" style="display:none;" data-other="sq8"></div></div>
            <button class="submit-btn support-btn" id="submitSupport">Отправить</button>`;
            document.getElementById('btnBack').addEventListener('click', renderHome);
            setupRadios();
            document.getElementById('submitSupport').addEventListener('click', () => {
                const d = { name: document.getElementById('s_name').value.trim(), age: document.getElementById(
                        's_age').value.trim(), nickname: document.getElementById('s_nick').value.trim() };
                [4, 5, 6, 7, 9, 10].forEach(i => d['q' + i] = document.getElementById('s_q' + i).value.trim());
                if (Object.values(d).some(v => !v)) { showToast('❌ Заполните все поля'); return; }
                if (parseInt(d.age) < 14) { showToast('❌ Возраст 14+'); return; }
                if (usedNicknames.support.includes(d.nickname.toLowerCase())) { showToast('❌ Уже подавал'); return; }
                const sq8 = document.querySelector('input[name="sq8"]:checked');
                if (!sq8) { showToast('❌ Ответьте на вопрос 8'); return; }
                const q8 = sq8.value === 'other' ? 'Другое: ' + (document.querySelector('[data-other="sq8"]')
                    ?.value || '') : sq8.value;
                saveApp('support', { ...d, q8, contacts: '', id: Date.now(), timestamp: new Date().toISOString() });
                usedNicknames.support.push(d.nickname.toLowerCase());
                showSuccess('support');
            });
        }

        function renderMediaForm() {
            currentDirection = 'media';
            document.getElementById('dynamicContent').innerHTML = `
            <button class="btn btn-back" id="btnBack">← Назад</button>
            <h1 class="main-title"><span class="gradient-text">🎬 Медиа</span></h1>
            ${['Никнейм','Ссылка на канал','Обороты','Время'].map((l,i)=>`<div class="form-group"><label>${l} *</label><input type="text" id="m_${['nick','link','stats','time'][i]}"></div>`).join('')}
            <div class="form-group"><label>Готовы 2-3 видео/нед? *</label><div class="radio-group">
              <label class="radio-option"><input type="radio" name="mq5" value="Да">Да</label>
              <label class="radio-option"><input type="radio" name="mq5" value="Нет">Нет</label>
              <label class="radio-option"><input type="radio" name="mq5" value="Другое">Другое:</label>
              <input type="text" class="other-input" style="display:none;" data-other="mq5"></div></div>
            <button class="submit-btn media-btn" id="submitMedia">Отправить</button>`;
            document.getElementById('btnBack').addEventListener('click', renderHome);
            setupRadios();
            document.getElementById('submitMedia').addEventListener('click', () => {
                const d = { nickname: document.getElementById('m_nick').value.trim(), link: document.getElementById(
                        'm_link').value.trim(), stats: document.getElementById('m_stats').value.trim(),
                    time: document.getElementById('m_time').value.trim() };
                const mq5 = document.querySelector('input[name="mq5"]:checked');
                if (Object.values(d).some(v => !v) || !mq5) { showToast('❌ Заполните все поля'); return; }
                saveApp('media', { ...d, q5: mq5.value === 'Другое' ? 'Другое: ' + (document.querySelector(
                        '[data-other="mq5"]')?.value || '') : mq5.value, contacts: '', id: Date.now(),
                    timestamp: new Date().toISOString() });
                showSuccess('media');
            });
        }

        function setupRadios() {
            document.querySelectorAll('.radio-option').forEach(o => o.addEventListener('click', function() {
                const r = this.querySelector('input');
                if (r) r.checked = true;
                this.parentElement.querySelectorAll('.radio-option').forEach(x => x.classList.remove(
                    'selected'));
                this.classList.add('selected');
                const oi = this.parentElement.querySelector('.other-input');
                if (oi) oi.style.display = r && (r.value === 'other' || r.value === 'Другое') ? 'block' :
                    'none';
            }));
        }

        function showSuccess(dir) {
            document.getElementById('dynamicContent').innerHTML = `
            <div class="success-block show">
              <div class="success-icon">${icons[dir]}</div>
              <h2>Заявка принята!</h2>
              <p>Направление: <strong>${labels[dir]}</strong></p>
              <div class="form-group"><label>Контакты (TG/VK)</label><input type="text" id="contacts"></div>
              <button class="submit-btn" id="saveContactsBtn">Сохранить</button>
              <button class="btn btn-back" id="successBack" style="margin-top:10px;">На главную</button>
            </div>`;
            document.getElementById('saveContactsBtn').addEventListener('click', () => {
                const c = document.getElementById('contacts').value.trim();
                if (!c) { showToast('❌ Введите контакты'); return; }
                const apps = getApps(dir);
                if (apps.length) { apps[apps.length - 1].contacts = c;
                    localStorage.setItem(STORAGE_KEYS[dir], JSON.stringify(apps)); }
                showToast('✅ Сохранено!');
                document.getElementById('saveContactsBtn').style.display = 'none';
            });
            document.getElementById('successBack').addEventListener('click', renderHome);
        }

        // ===== АДМИН-ПАНЕЛЬ =====
        function showAdminLogin() {
            document.getElementById('dynamicContent').innerHTML = `
            <div style="max-width:400px;margin:40px auto;text-align:center;">
              <h2>🔐 Вход</h2>
              <div class="form-group"><input type="password" id="adminPass" placeholder="Пароль"></div>
              <button class="submit-btn" id="loginBtn">Войти</button>
              <button class="btn btn-back" id="cancelBtn" style="margin-top:10px;">Отмена</button>
            </div>`;
            document.getElementById('loginBtn').addEventListener('click', () => {
                if (document.getElementById('adminPass').value !== ADMIN_PASS) { showToast('❌ Неверный пароль'); return; }
                isAdmin = true;
                adminTab = 'personnel';
                renderAdminPanel();
            });
            document.getElementById('cancelBtn').addEventListener('click', renderHome);
        }

        async function renderAdminPanel() {
            await fetchToggles();
            const toggles = getToggles();
            const tabs = ['personnel', 'support', 'media'];
            document.getElementById('headerActions').innerHTML =
                `<button class="btn btn-back" id="adminExit">Выйти</button>`;
            document.getElementById('adminExit').addEventListener('click', () => { isAdmin = false;
                renderHome(); });
            document.getElementById('dynamicContent').innerHTML = `
            <h1 class="main-title"><span class="gradient-text">🔐 Админ-панель</span></h1>
            <div class="admin-tabs">${tabs.map(t=>`<button class="admin-tab${adminTab===t?' active':''}" data-tab="${t}">${labels[t]}</button>`).join('')}</div>
            ${tabs.map(t=>`
            <div class="toggle-row">
              <span>${icons[t]} ${labels[t]}:</span>
              <label class="toggle-switch"><input type="checkbox" id="tgl_${t}" ${toggles[t]?'checked':''}><span class="toggle-slider"></span></label>
              <span id="status_${t}">${toggles[t]?'✅ Открыт':'🔒 Закрыт'}</span>
            </div>`).join('')}
            <div id="adminTableArea"></div>`;
            document.querySelectorAll('.admin-tab').forEach(b => b.addEventListener('click', function() { adminTab = this
                    .dataset.tab;
                renderAdminPanel(); }));
            tabs.forEach(t => {
                document.getElementById('tgl_' + t).addEventListener('change', async function() {
                    const val = this.checked;
                    document.getElementById('status_' + t).textContent = '⏳ Сохранение...';
                    await saveToggle(t, val);
                    document.getElementById('status_' + t).textContent = val ? '✅ Открыт' : '🔒 Закрыт';
                    showToast(val ? '✅ Набор открыт' : '🔒 Набор закрыт');
                });
            });
            renderAdminTable();
        }

        function renderAdminTable() {
            const apps = getApps(adminTab);
            const area = document.getElementById('adminTableArea');
            let html =
                `<p>Всего заявок: <strong>${apps.length}</strong></p><div class="table-wrapper"><table class="admin-table"><thead><tr><th>Дата</th><th>Ник</th><th>Имя</th><th>Контакты</th><th>Действия</th></tr></thead><tbody>`;
            if (!apps.length) html += '<tr><td colspan="5">Нет заявок</td></tr>';
            else apps.forEach(a => {
                html +=
                    `<tr><td>${new Date(a.timestamp).toLocaleDateString('ru-RU')}</td><td><strong>${escapeHtml(a.nickname||'')}</strong></td><td>${escapeHtml(a.name||'')}</td><td>${escapeHtml(a.contacts||'—')}</td><td><button class="expand-btn" data-id="${a.id}">📋</button> <button class="delete-btn" data-id="${a.id}">🗑</button></td></tr>`;
            });
            html += '</tbody></table></div>';
            area.innerHTML = html;
            area.querySelectorAll('.expand-btn').forEach(b => b.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                const er = document.getElementById('det' + id);
                if (er) { er.remove(); return; }
                const app = apps.find(a => a.id === id);
                if (!app) return;
                const tr = document.createElement('tr');
                tr.id = 'det' + id;
                tr.innerHTML =
                    `<td colspan="5" style="background:var(--glass);padding:16px;">${Object.entries(app).filter(([k])=>!['id','timestamp','contacts'].includes(k)).map(([k,v])=>'<strong>'+k+':</strong> '+escapeHtml(typeof v==='object'?JSON.stringify(v):v)).join('<br><br>')}</td>`;
                this.closest('tr').after(tr);
            }));
            area.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', function() {
                if (!confirm('Удалить?')) return;
                const id = parseInt(this.dataset.id);
                const apps = getApps(adminTab).filter(a => a.id !== id);
                localStorage.setItem(STORAGE_KEYS[adminTab], JSON.stringify(apps));
                loadUsedNicknames();
                renderAdminTable();
                showToast('🗑 Удалено');
            }));
        }

        init();
    </script>
</body>
</html>

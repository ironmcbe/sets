<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Набор в команду | IronMine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat+Alternates:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #f0f4f8;
            --card: rgba(255, 255, 255, 0.88);
            --glass: rgba(255, 255, 255, 0.55);
            --border: rgba(76, 175, 80, 0.15);
            --accent: #43a047;
            --accent-light: #66bb6a;
            --accent-dark: #2e7d32;
            --accent-glow: rgba(67, 160, 71, 0.2);
            --accent2: #1565c0;
            --accent2-light: #1976d2;
            --accent2-glow: rgba(25, 118, 210, 0.2);
            --accent3: #e65100;
            --accent3-light: #ff6d00;
            --accent3-glow: rgba(230, 81, 0, 0.2);
            --text: #1a1a2e;
            --text-secondary: #5a6a7a;
            --heading: #0d1b0d;
            --input-bg: #fff;
            --input-border: #e2e8f0;
            --danger: #e53935;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.dark {
            --bg: #0a0e1a;
            --card: rgba(15, 20, 35, 0.92);
            --glass: rgba(15, 20, 35, 0.7);
            --border: rgba(102, 187, 106, 0.12);
            --accent: #66bb6a;
            --accent-light: #81c784;
            --accent-dark: #4caf50;
            --accent-glow: rgba(102, 187, 106, 0.15);
            --accent2: #42a5f5;
            --accent2-light: #64b5f6;
            --accent2-glow: rgba(66, 165, 245, 0.15);
            --accent3: #ff6d00;
            --accent3-light: #ff9100;
            --accent3-glow: rgba(255, 109, 0, 0.15);
            --text: #d0d8e8;
            --text-secondary: #8899aa;
            --heading: #e8edf5;
            --input-bg: #141b2b;
            --input-border: #2a3344;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(67, 160, 71, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(102, 187, 106, 0.03) 0%, transparent 60%);
            background-attachment: fixed;
            user-select: none;
            -webkit-user-select: none;
        }
        body.dark {
            background-image: radial-gradient(ellipse at 10% 20%, rgba(102, 187, 106, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(129, 199, 132, 0.02) 0%, transparent 60%);
        }
        input,
        textarea {
            user-select: text;
            -webkit-user-select: text;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 36px;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            animation: containerIn 0.5s ease;
        }
        @keyframes containerIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .container.wide {
            max-width: 1100px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-logo {
            font-family: 'Montserrat Alternates', sans-serif;
            font-weight: 900;
            font-size: 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo i {
            -webkit-text-fill-color: var(--accent);
            font-size: 26px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-theme {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-admin {
            background: linear-gradient(135deg, var(--accent2), var(--accent2-light));
            box-shadow: 0 4px 16px var(--accent2-glow);
        }
        .btn-back {
            background: var(--glass);
            color: var(--text) !important;
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .btn-back:hover {
            background: var(--input-border);
        }
        .main-title {
            text-align: center;
            font-size: clamp(28px, 5vw, 38px);
            font-weight: 900;
            letter-spacing: -0.5px;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
            position: relative;
        }
        .main-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 4px;
        }
        .main-title .gradient-text {
            font-family: 'Montserrat Alternates', sans-serif;
            background: linear-gradient(135deg, var(--accent), var(--accent-light), var(--accent-dark), var(--accent-light));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 6s ease infinite;
        }
        @keyframes gradientMove {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .sub-header {
            text-align: center;
            font-size: 14px;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .sub-header a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .direction-card {
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .direction-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }
        .direction-card.personnel {
            border-left: 4px solid var(--accent);
        }
        .direction-card.personnel:hover {
            border-color: var(--accent);
            box-shadow: 0 12px 40px var(--accent-glow);
        }
        .direction-card.support {
            border-left: 4px solid var(--accent2);
        }
        .direction-card.support:hover {
            border-color: var(--accent2);
            box-shadow: 0 12px 40px var(--accent2-glow);
        }
        .direction-card.media {
            border-left: 4px solid var(--accent3);
        }
        .direction-card.media:hover {
            border-color: var(--accent3);
            box-shadow: 0 12px 40px var(--accent3-glow);
        }
        .direction-card .card-icon {
            font-size: 52px;
            margin-bottom: 16px;
            display: block;
        }
        .direction-card.personnel .card-icon {
            color: var(--accent);
        }
        .direction-card.support .card-icon {
            color: var(--accent2);
        }
        .direction-card.media .card-icon {
            color: var(--accent3);
        }
        .direction-card .card-title {
            font-family: 'Montserrat Alternates', sans-serif;
            font-weight: 800;
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--heading);
        }
        .direction-card .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .direction-card .card-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 12px;
        }
        .direction-card.personnel .card-badge {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .direction-card.support .card-badge {
            background: #e3f2fd;
            color: #0d47a1;
        }
        .direction-card.media .card-badge {
            background: #fff3e0;
            color: #bf360c;
        }
        body.dark .direction-card.personnel .card-badge {
            background: #0f1a0f;
            color: #81c784;
        }
        body.dark .direction-card.support .card-badge {
            background: #001a2a;
            color: #64b5f6;
        }
        body.dark .direction-card.media .card-badge {
            background: #2a1000;
            color: #ffab40;
        }
        .closed-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .section {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent);
            transition: all var(--transition);
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .section-title {
            font-family: 'Montserrat Alternates', sans-serif;
            font-weight: 800;
            font-size: 19px;
            color: var(--heading);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title .icon {
            color: var(--accent);
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--heading);
        }
        label .required {
            color: var(--danger);
        }
        label .hint {
            display: block;
            font-weight: 400;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        input[type="text"],
        input[type="number"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 13px 18px;
            border: 2px solid var(--input-border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--input-bg);
            color: var(--text);
            transition: all var(--transition);
            outline: none;
            resize: vertical;
            -webkit-appearance: none;
        }
        input:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(67, 160, 71, 0.08);
        }
        textarea {
            min-height: 100px;
            line-height: 1.7;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
        }
        .radio-option:hover {
            border-color: var(--accent-light);
            transform: translateX(4px);
        }
        .radio-option input[type="radio"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .radio-option.selected {
            border-color: var(--accent);
            background: rgba(67, 160, 71, 0.06);
            box-shadow: 0 0 0 4px rgba(67, 160, 71, 0.06);
        }
        .submit-btn {
            width: 100%;
            padding: 18px 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            box-shadow: 0 6px 24px var(--accent-glow);
            transition: all var(--transition);
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
        }
        .submit-btn:active {
            transform: scale(0.96);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px var(--accent-glow);
        }
        .submit-btn.support-btn {
            background: linear-gradient(135deg, var(--accent2), var(--accent2-light));
            box-shadow: 0 6px 24px var(--accent2-glow);
        }
        .submit-btn.media-btn {
            background: linear-gradient(135deg, var(--accent3), var(--accent3-light));
            box-shadow: 0 6px 24px var(--accent3-glow);
        }
        .success-block {
            display: none;
            text-align: center;
            padding: 50px 30px;
        }
        .success-block.show {
            display: block;
            animation: successIn 0.5s ease;
        }
        @keyframes successIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .success-icon {
            font-size: 80px;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .success-title {
            font-family: 'Montserrat Alternates', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--heading);
            margin-bottom: 12px;
        }
        .success-text {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--heading);
            color: var(--bg);
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            max-width: 90vw;
            text-align: center;
        }
        body.dark .toast {
            background: #e0e8f0;
            color: #1a1a2e;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .scroll-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 18px;
            z-index: 999;
            opacity: 0;
            transform: translateY(20px);
            transition: all var(--transition);
            box-shadow: 0 4px 18px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scroll-top.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .admin-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .admin-tab {
            padding: 10px 20px;
            border: 2px solid var(--input-border);
            border-radius: 50px;
            background: var(--input-bg);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text);
        }
        .admin-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .toggle-label {
            font-weight: 700;
            font-size: 14px;
            color: var(--heading);
            min-width: 120px;
        }
        .toggle-switch {
            position: relative;
            width: 52px;
            height: 28px;
            flex-shrink: 0;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 28px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: all var(--transition);
        }
        input:checked+.toggle-slider {
            background: var(--accent);
        }
        input:checked+.toggle-slider::before {
            transform: translateX(24px);
        }
        .table-wrapper {
            overflow-x: auto;
            max-height: 55vh;
            overflow-y: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-top: 14px;
        }
        .table-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .admin-table th {
            padding: 14px 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 2;
            text-align: left;
        }
        .admin-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .admin-table .expand-btn,
        .admin-table .delete-btn {
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all var(--transition);
        }
        .admin-table .expand-btn {
            background: var(--glass);
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .admin-table .delete-btn {
            background: var(--danger);
            color: #fff;
            border: none;
        }
        .logout-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
        }
        .stat-card .stat-num {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
        }
        .stat-card .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        @media (max-width: 640px) {
            .container {
                padding: 20px 14px;
                border-radius: 16px;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .main-title {
                font-size: 22px;
            }
            .section {
                padding: 18px 14px;
            }
            .section-title {
                font-size: 16px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-chevron-up"></i></button>
    <div class="container" id="appContainer">
        <header class="header">
            <div class="brand-logo"><i class="fas fa-crown"></i> IronMine</div>
            <div class="header-actions" id="headerActions">
                <button class="btn btn-theme" id="themeToggle"><i class="fas fa-moon"></i> Тема</button>
                <button class="btn btn-admin" id="adminBtn"><i class="fas fa-lock"></i> Админ</button>
            </div>
        </header>
        <div id="dynamicContent"></div>
        <footer style="margin-top:36px;padding-top:24px;border-top:2px solid var(--border);text-align:center;">

                this.classList.add('selected');
                const oi = g.querySelector('.other-input');
                if (oi) oi.style.display = r && r.value === 'Другое' ? 'block' : 'none';
            }));
            document.getElementById('submitMedia').addEventListener('click', () => {
                const nickname = document.getElementById('m_nick').value.trim();
                const link = document.getElementById('m_link').value.trim();
                const stats = document.getElementById('m_stats').value.trim();
                const time = document.getElementById('m_time').value.trim();
                const mq5 = document.querySelector('input[name="mq5"]:checked');
                if (!nickname || !link || !stats || !time || !mq5) { showToast('❌ Заполните все поля'); return; }
                const q5ans = mq5.value === 'Другое' ? 'Другое: ' + (document.querySelector('[data-other="mq5"]')
                    ?.value || '') : mq5.value;
                const app = { nickname, link, stats, time, q5: q5ans, contacts: '', timestamp: new Date()
                        .toISOString(), id: Date.now() };
                saveApp('media', app);
                showSuccess('media');
            });
        }

        function showSuccess(dir) {
            const titles = { personnel: 'Персонал', support: 'Поддержка', media: 'Медиа' };
            const icons = { personnel: '🛡️', support: '🎧', media: '🎬' };
            document.getElementById('dynamicContent').innerHTML = `
            <div class="success-block show">
              <div class="success-icon">${icons[dir]}</div>
              <h2 class="success-title">Заявка принята!</h2>
              <div class="success-text">Вы подали заявку в направление <strong>${titles[dir]}</strong>. Ожидайте итогов в Telegram.</div>
              <div class="form-group"><label>Оставьте контакты (Telegram / VK)</label><input type="text" id="contacts" placeholder="@username"></div>
              <button class="submit-btn" id="saveContacts">Сохранить контакты</button>
            </div>`;
            document.getElementById('saveContacts').addEventListener('click', () => {
                const c = document.getElementById('contacts').value.trim();
                if (!c) { showToast('❌ Введите контакты'); return; }
                const apps = getApps(dir);
                if (apps.length > 0) { apps[apps.length - 1].contacts = c;
                    localStorage.setItem(STORAGE_KEYS[dir], JSON.stringify(apps)); }
                showToast('✅ Контакты сохранены!');
                document.getElementById('saveContacts').style.display = 'none';
            });
        }

        function showAdminLogin() {
            document.getElementById('dynamicContent').innerHTML = `
            <div style="max-width:420px;margin:40px auto;text-align:center;">
              <h2 class="section-title" style="justify-content:center;"><i class="fas fa-lock"></i> Вход</h2>
              <div class="form-group"><input type="password" id="adminPass" placeholder="Пароль"></div>
              <button class="submit-btn" id="loginBtn">Войти</button>
              <button class="logout-btn" id="cancelBtn" style="margin-top:10px;">Отмена</button>
            </div>`;
            document.getElementById('loginBtn').addEventListener('click', () => {
                if (document.getElementById('adminPass').value !== ADMIN_PASS) { showToast('❌ Неверный пароль'); return; }
                isAdmin = true;
                try { sessionStorage.setItem(ADMIN_STATE_KEY, 'true'); } catch (e) {}
                adminTab = 'personnel';
                renderAdminPanel();
            });
            document.getElementById('cancelBtn').addEventListener('click', renderHome);
            document.getElementById('headerActions').innerHTML = '';
        }

        function renderAdminPanel() {
            const tabs = ['personnel', 'support', 'media'];
            const labels = { personnel: '🛡️ Персонал', support: '🎧 Поддержка', media: '🎬 Медиа' };
            const toggles = getToggles();
            document.getElementById('headerActions').innerHTML =
                `<button class="btn btn-back" id="adminExit"><i class="fas fa-sign-out-alt"></i> Выйти</button>`;
            document.getElementById('adminExit').addEventListener('click', () => { isAdmin = false; try { sessionStorage.removeItem(ADMIN_STATE_KEY); } catch (e) {}
                renderHome(); });
            document.getElementById('appContainer').classList.add('wide');
            document.getElementById('dynamicContent').innerHTML = `
            <h1 class="main-title"><span class="gradient-text">🔐 Админ-панель</span></h1>
            <div class="admin-tabs">${tabs.map(t => `<button class="admin-tab${adminTab===t?' active':''}" data-tab="${t}">${labels[t]}</button>`).join('')}</div>
            <div class="toggle-row">
              <span class="toggle-label">🛡️ Персонал:</span>
              <label class="toggle-switch"><input type="checkbox" id="tgl_personnel" ${toggles.personnel?'checked':''}><span class="toggle-slider"></span></label>
              <span style="font-size:12px;color:var(--text-secondary);">${toggles.personnel?'Открыт':'Закрыт'}</span>
            </div>
            <div class="toggle-row">
              <span class="toggle-label">🎧 Поддержка:</span>
              <label class="toggle-switch"><input type="checkbox" id="tgl_support" ${toggles.support?'checked':''}><span class="toggle-slider"></span></label>
              <span style="font-size:12px;color:var(--text-secondary);">${toggles.support?'Открыт':'Закрыт'}</span>
            </div>
            <div class="toggle-row">
              <span class="toggle-label">🎬 Медиа:</span>
              <label class="toggle-switch"><input type="checkbox" id="tgl_media" ${toggles.media?'checked':''}><span class="toggle-slider"></span></label>
              <span style="font-size:12px;color:var(--text-secondary);">${toggles.media?'Открыт':'Закрыт'}</span>
            </div>
            <div id="adminTableArea"></div>`;
            document.querySelectorAll('.admin-tab').forEach(btn => {
                btn.addEventListener('click', function() { adminTab = this.dataset.tab;
                    renderAdminPanel(); });
            });
            ['personnel', 'support', 'media'].forEach(k => {
                document.getElementById('tgl_' + k).addEventListener('change', function() { setToggle(k, this
                        .checked);
                    renderAdminPanel(); });
            });
            renderAdminTable();
        }

        function renderAdminTable() {
            const apps = getApps(adminTab);
            const area = document.getElementById('adminTableArea');
            let html = `<div class="stats-bar"><div class="stat-card"><div class="stat-num">${apps.length}</div><div class="stat-label">Всего</div></div></div>`;
            html +=
                `<div class="table-wrapper"><table class="admin-table"><thead><tr><th>Дата</th><th>Ник</th><th>Имя</th><th>Возр.</th><th>Контакты</th><th>Действ.</th></tr></thead><tbody>`;
            if (apps.length === 0) html +=
                '<tr><td colspan="6" style="text-align:center;padding:30px;">Нет заявок</td></tr>';
            else apps.forEach(a => {
                html +=
                    `<tr id="r${a.id}"><td>${new Date(a.timestamp).toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td><strong>${escapeHtml(a.nickname||'')}</strong></td><td>${escapeHtml(a.name||'')}</td><td>${escapeHtml(a.age||'')}</td><td>${escapeHtml(a.contacts||'—')}</td><td><button class="expand-btn" data-id="${a.id}">📋</button> <button class="delete-btn" data-id="${a.id}">🗑</button></td></tr>`;
            });
            html += '</tbody></table></div>';
            area.innerHTML = html;
            area.querySelectorAll('.expand-btn').forEach(b => b.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                const row = document.getElementById('det' + id);
                if (row) { row.remove(); return; }
                const app = apps.find(a => a.id === id);
                if (!app) return;
                const tr = document.createElement('tr');
                tr.id = 'det' + id;
                tr.innerHTML =
                    `<td colspan="6" style="background:var(--glass);padding:16px;line-height:1.8;">${Object.entries(app).filter(([k])=>!['id','timestamp','contacts'].includes(k)).map(([k,v])=>'<strong>'+k+':</strong> '+escapeHtml(typeof v==='object'?JSON.stringify(v):v)).join('<br><br>')}</td>`;
                this.closest('tr').after(tr);
            }));
            area.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (!confirm('Удалить заявку #' + id + '?')) return;
                const apps = getApps(adminTab).filter(a => a.id !== id);
                localStorage.setItem(STORAGE_KEYS[adminTab], JSON.stringify(apps));
                loadUsedNicknames();
                renderAdminTable();
                showToast('🗑 Удалено');
            }));
        }

        init();
    </script>
</body>
</html>
